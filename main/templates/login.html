<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Sign in to Account</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&family=Poppins:wght@100..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            font-family: "Montserrat", serif;
            margin: 10rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form {
            background-color: #fff;
            display: inline-block;
            padding: 3rem;
            border: 1px solid rgb(216, 211, 211);
            border-radius: 0.5rem;
            box-shadow: 5px 50px 15px -3px rgba(0, 0, 0, 0.1), 0 17px 29px -2px rgba(0, 0, 0, 0.05);
        }

        .form-title {
            font-size: 1.25rem;
            font-weight: 600;
            text-align: center;
            color: #000;
            margin-bottom: 2rem;
        }

        .input-container {
            position: relative;
        }

        .input-container input,
        .form button {
            outline: none;
            border: 1px solid #e5e7eb;
            margin: 8px 0;
        }

        .input-container input {
            background-color: #fff;
            padding: 1rem;
            font-size: 0.875rem;
            width: 300px;
            border-radius: 0.5rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .submit {
            display: block;
            padding: 0.75rem 1.25rem;
            background-color: #2bd0d0;
            color: #ffffff;
            font-size: 0.875rem;
            font-weight: 500;
            width: 100%;
            border-radius: 0.5rem;
            text-transform: uppercase;
        }

        .signup-link {
            color: #6B7280;
            font-size: 0.875rem;
            text-align: center;
        }

        .signup-link a {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <form class="form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p class="form-title">Sign in to your account</p>
        <div class="input-container">
            <input type="text" placeholder="Enter Username" name="username">
        </div>
        <div class="input-container">
            <input type="password" placeholder="Enter password" name="password">
        </div>
        <button type="submit" class="submit">
            Sign in
        </button>

        <p class="signup-link">
            No account?
            <a href="/signup/">Sign up</a>
        </p>
    </form>

    {% if messages %}
    <div class="toast-container position-fixed bottom-0 start-0 p-3 bg-red">
        <div class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Login Message</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body">
                {% for message in messages %}
                    {{ message }}
                {% endfor %}
            </div>
        </div>
    </div>
    {% endif %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var toastEl = document.querySelector('.toast');
            if (toastEl) {
                var toast = new bootstrap.Toast(toastEl);
                toast.show();
            }
        });
    </script>
</body>

</html>
